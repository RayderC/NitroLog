services:
  nitrolog:
    image: rayderc/nitrolog:latest
    container_name: nitrolog
    ports:
      - "7100:7100"
    volumes:
      - nitrolog_data:/config
    # environment:
    #   # Optional: free eBay keys for part prices on the service form (see README).
    #   EBAY_CLIENT_ID: ""
    #   EBAY_CLIENT_SECRET: ""
    #   # Optional: a free Google Gemini key, for reading screenshots and receipts (see README).
    #   GEMINI_API_KEY: ""
    restart: unless-stopped

volumes:
  nitrolog_data:
